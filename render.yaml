services:
  - type: web
    name: nexustierss
    runtime: docker
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: NEXUS_TIERS_GUILD_ID
        value: "1552686607289684098"
      - key: NEXUS_SUBTIERS_GUILD_ID
        value: "1570409542171238420"
